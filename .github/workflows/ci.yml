# Runs scripts/ci.sh (the single definition of "green") on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # the token can read the repo and nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Throwaway credentials of the Docker database defined in docker-compose.yml (never real secrets).
      MIGRATE_URL: postgresql://postgres:dev_postgres_pw@127.0.0.1:54320/gems
      ADMIN_DATABASE_URL: postgresql://postgres:dev_postgres_pw@127.0.0.1:54320/gems
      APP_DATABASE_URL: postgresql://gems_app:dev_app_pw@127.0.0.1:64320/gems
      JOB_DATABASE_URL: postgresql://gems_job:dev_job_pw@127.0.0.1:64320/gems
      AUTH_DATABASE_URL: postgresql://gems_auth:dev_auth_pw@127.0.0.1:64320/gems
      ETL_DATABASE_URL: postgresql://gems_etl:dev_etl_pw@127.0.0.1:54320/gems # direct, not PgBouncer
      ETL_DB_PASSWORD: dev_etl_pw
      ETL_SALT: dev_etl_salt
      NEXT_TELEMETRY_DISABLED: "1"
      STORAGE_DRIVER: fake # ticket documents: in-memory fake in CI (ADR-002); no Supabase secrets here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Per-run encryption key for TOTP secrets in tests
        run: echo "AUTH_ENC_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: bash scripts/ci.sh
