[databases]
gems = host=db port=5432 dbname=gems

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; 2 server connections per user, so T-RLS-009 forces heavy connection reuse
default_pool_size = 2
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
