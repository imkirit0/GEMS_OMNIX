# POC only. Passwords here are throwaway local test credentials, not secrets.
services:
  db:
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b # 17.11-alpine
    environment:
      POSTGRES_PASSWORD: postgres_pw
      POSTGRES_DB: gems
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./sql:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "gems"]
      interval: 2s
      retries: 30
  bouncer:
    image: edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d # 1.26.1
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:56432:6432"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
